version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unparam
    - unused
  exclusions:
    rules:
      # Repeated literals in test fixtures do not need to be constants.
      - path: _test\.go
        linters:
          - goconst
  settings:
    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: var-naming
        - name: package-comments
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 3
    testifylint:
      enable-all: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
